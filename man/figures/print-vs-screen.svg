<svg xmlns="http://www.w3.org/2000/svg" width="956" height="428" viewBox="0 0 956 428" font-family="Helvetica, Arial, sans-serif">
<style>.h{font-size:15px;font-weight:bold;fill:#222}.s{font-size:12px;fill:#555}.name{font-size:12px;fill:#222}.meta{font-size:10.5px;fill:#666}</style>
<rect width="956" height="428" fill="#ffffff"/>
<text x="16" y="24" class="h">Screen (sRGB hex, left) vs print (CMYK recipe, right)</text>
<text x="16" y="42" class="s">Most lost on screen: full-cyan teals and blues, and pure yellow</text>
<rect x="16" y="58" width="60" height="76" fill="#00939B"/><rect x="76" y="58" width="60" height="76" fill="#00939B" style="fill: color(display-p3 0.0000 0.5664 0.5982)"/><text x="16" y="150" class="name">Peacock Blue</text><text x="16" y="165" class="meta">C100 M19 Y43 K0</text><text x="16" y="179" class="meta">sRGB ΔE 6.5 · P3 2.3</text>
<rect x="150" y="58" width="60" height="76" fill="#00978D"/><rect x="210" y="58" width="60" height="76" fill="#00978D" style="fill: color(display-p3 0.0000 0.5799 0.5482)"/><text x="150" y="150" class="name">Benzol Green</text><text x="150" y="165" class="meta">C100 M15 Y55 K0</text><text x="150" y="179" class="meta">sRGB ΔE 6.4 · P3 2.1</text>
<rect x="284" y="58" width="60" height="76" fill="#004F46"/><rect x="344" y="58" width="60" height="76" fill="#004F46" style="fill: color(display-p3 0.0000 0.3043 0.2739)"/><text x="284" y="150" class="name">Dusky Green</text><text x="284" y="165" class="meta">C100 M30 Y64 K50</text><text x="284" y="179" class="meta">sRGB ΔE 5.5 · P3 1.9</text>
<rect x="418" y="58" width="60" height="76" fill="#007190"/><rect x="478" y="58" width="60" height="76" fill="#007190" style="fill: color(display-p3 0.0000 0.4347 0.5524)"/><text x="418" y="150" class="name">Antwarp Blue</text><text x="418" y="165" class="meta">C100 M40 Y30 K10</text><text x="418" y="179" class="meta">sRGB ΔE 4.9 · P3 1.2</text>
<rect x="552" y="58" width="60" height="76" fill="#006EB8"/><rect x="612" y="58" width="60" height="76" fill="#006EB8" style="fill: color(display-p3 0.0687 0.4233 0.6997)"/><text x="552" y="150" class="name">Blue</text><text x="552" y="165" class="meta">C95 M54 Y0 K0</text><text x="552" y="179" class="meta">sRGB ΔE 2.9 · P3 0.0</text>
<rect x="686" y="58" width="60" height="76" fill="#005B8D"/><rect x="746" y="58" width="60" height="76" fill="#005B8D" style="fill: color(display-p3 0.0510 0.3484 0.5375)"/><text x="686" y="150" class="name">Helvetia Blue</text><text x="686" y="165" class="meta">C100 M62 Y19 K10</text><text x="686" y="179" class="meta">sRGB ΔE 2.6 · P3 0.0</text>
<rect x="820" y="58" width="60" height="76" fill="#FFF200"/><rect x="880" y="58" width="60" height="76" fill="#FFF200" style="fill: color(display-p3 1.0000 0.9516 0.2913)"/><text x="820" y="150" class="name">Yellow</text><text x="820" y="165" class="meta">C0 M0 Y100 K0</text><text x="820" y="179" class="meta">sRGB ΔE 2.1 · P3 1.4</text>
<text x="16" y="226" class="s">Typical: 148 of the 159 colours differ by less than 1 ΔE, which is imperceptible</text>
<rect x="16" y="238" width="60" height="76" fill="#F9C1CE"/><rect x="76" y="238" width="60" height="76" fill="#F9C1CE" style="fill: color(display-p3 0.9424 0.7649 0.8068)"/><text x="16" y="330" class="name">Hermosa Pink</text><text x="16" y="345" class="meta">C0 M30 Y6 K0</text><text x="16" y="359" class="meta">sRGB ΔE 0.0</text>
<rect x="150" y="238" width="60" height="76" fill="#AE5224"/><rect x="210" y="238" width="60" height="76" fill="#AE5224" style="fill: color(display-p3 0.6366 0.3423 0.1884)"/><text x="150" y="330" class="name">Burnt Sienna</text><text x="150" y="345" class="meta">C22 M76 Y100 K15</text><text x="150" y="359" class="meta">sRGB ΔE 0.0</text>
<rect x="284" y="238" width="60" height="76" fill="#FCB315"/><rect x="344" y="238" width="60" height="76" fill="#FCB315" style="fill: color(display-p3 0.9464 0.7139 0.2625)"/><text x="284" y="330" class="name">Orange Yellow</text><text x="284" y="345" class="meta">C0 M33 Y100 K0</text><text x="284" y="359" class="meta">sRGB ΔE 0.1</text>
<rect x="418" y="238" width="60" height="76" fill="#40456A"/><rect x="478" y="238" width="60" height="76" fill="#40456A" style="fill: color(display-p3 0.2540 0.2707 0.4047)"/><text x="418" y="330" class="name">Violet Blue</text><text x="418" y="345" class="meta">C85 M79 Y38 K16</text><text x="418" y="359" class="meta">sRGB ΔE 0.2</text>
<text x="16" y="392" class="s">Right halves use Display P3. On a wide-gamut screen (recent Macs, iPhones, many laptops) they show the printed colour, or as close as P3 gets;</text>
<text x="16" y="408" class="s">on a standard sRGB screen both halves look the same, because that is all the screen can show. ΔE is CIEDE2000 from the printed colour.</text>
</svg>
